dispatch:
  - when: { kind: planning, stage: plan }
    pass: planner
    on: { success: done }

  - when: { kind: engineering, stage: generate }
    pass: generator
    on: { success: review }

  - when: { kind: engineering, stage: review }
    pass: reviewer
    on: { success: done, reject: generate }

concurrency:
  planner: 3
  generator: 5
  reviewer: 3
